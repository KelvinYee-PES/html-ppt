[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "htmlppt"
version = "0.1.0"
description = "Convert AI-generated HTML into brand-compliant, fully editable PowerPoint decks"
requires-python = ">=3.11"
dependencies = [
  "python-pptx>=1.0",
  "playwright>=1.45",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "pydantic>=2.6",
  "lxml>=5.0",
  "pillow>=10.0",
  "typer>=0.12",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
htmlppt = "htmlppt.cli:app"

[tool.setuptools.packages.find]
include = ["htmlppt*"]

[tool.setuptools.package-data]
htmlppt = ["extract/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
